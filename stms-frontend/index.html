<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcadTrack - Academic Task Management</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- AcadTrack Design System Tailwind config -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-tertiary-fixed-variant": "#0b513d",
            "on-primary-fixed-variant": "#005236",
            "on-background": "#161d19",
            "on-error-container": "#93000a",
            "on-surface": "#161d19",
            "surface-container-low": "#eef6ee",
            "on-primary-container": "#00422b",
            "primary": "#006c49",
            "surface-container": "#e8f0e9",
            "tertiary-fixed": "#b0f0d6",
            "on-tertiary": "#ffffff",
            "tertiary-fixed-dim": "#95d3ba",
            "secondary-fixed": "#ffddb8",
            "on-primary-fixed": "#002113",
            "primary-fixed-dim": "#4edea3",
            "inverse-primary": "#4edea3",
            "on-secondary-fixed": "#2a1700",
            "surface-bright": "#f4fbf4",
            "on-secondary": "#ffffff",
            "surface-container-highest": "#dde4dd",
            "on-surface-variant": "#3c4a42",
            "on-tertiary-fixed": "#002117",
            "secondary": "#855300",
            "surface-container-lowest": "#ffffff",
            "tertiary": "#2b6954",
            "primary-fixed": "#6ffbbe",
            "on-secondary-container": "#684000",
            "on-tertiary-container": "#004231",
            "tertiary-container": "#71af97",
            "surface-tint": "#006c49",
            "surface-dim": "#d4dcd5",
            "error-container": "#ffdad6",
            "surface-container-high": "#e3eae3",
            "inverse-on-surface": "#ebf3eb",
            "on-primary": "#ffffff",
            "secondary-container": "#fea619",
            "surface-variant": "#dde4dd",
            "primary-container": "#10b981",
            "on-error": "#ffffff",
            "secondary-fixed-dim": "#ffb95f",
            "on-secondary-fixed-variant": "#653e00",
            "outline-variant": "#bbcabf",
            "surface": "#f4fbf4",
            "error": "#ba1a1a",
            "inverse-surface": "#2b322d",
            "background": "#f4fbf4",
            "outline": "#6c7a71"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "body-lg": ["Inter"],
            "button-text": ["Inter"],
            "h2": ["Poppins"],
            "h3": ["Poppins"],
            "h1": ["Poppins"],
            "label-caps": ["Inter"],
            "body-md": ["Inter"],
            "body-sm": ["Inter"]
          },
          fontSize: {
            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "button-text": ["16px", { "lineHeight": "1", "fontWeight": "600" }],
            "h2": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
            "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
            "h1": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
