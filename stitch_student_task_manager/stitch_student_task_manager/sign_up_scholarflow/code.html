<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarFlow - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#ffdad6",
                      "surface-container-low": "#eff4ff",
                      "outline-variant": "#bbcabf",
                      "tertiary-container": "#fc7c78",
                      "on-tertiary-fixed": "#410005",
                      "surface-tint": "#006c49",
                      "on-surface-variant": "#3c4a42",
                      "on-error-container": "#93000a",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed": "#6ffbbe",
                      "on-secondary-fixed": "#002117",
                      "surface-container-highest": "#d3e4fe",
                      "on-primary-fixed": "#002113",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#842225",
                      "on-primary-fixed-variant": "#005236",
                      "surface": "#f8f9ff",
                      "secondary": "#2b6954",
                      "on-secondary-container": "#306d58",
                      "inverse-surface": "#213145",
                      "surface-bright": "#f8f9ff",
                      "inverse-primary": "#4edea3",
                      "on-primary-container": "#00422b",
                      "on-tertiary-container": "#711419",
                      "on-surface": "#0b1c30",
                      "on-secondary-fixed-variant": "#0b513d",
                      "surface-variant": "#d3e4fe",
                      "tertiary-fixed-dim": "#ffb3af",
                      "tertiary": "#a43a3a",
                      "secondary-container": "#adedd3",
                      "primary": "#006c49",
                      "secondary-fixed-dim": "#95d3ba",
                      "primary-container": "#10b981",
                      "on-background": "#0b1c30",
                      "secondary-fixed": "#b0f0d6",
                      "background": "#f8f9ff",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed": "#ffdad7",
                      "primary-fixed-dim": "#4edea3",
                      "on-error": "#ffffff",
                      "outline": "#6c7a71",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "surface-container": "#e5eeff",
                      "surface-dim": "#cbdbf5",
                      "inverse-on-surface": "#eaf1ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "8px",
                      "xs": "4px",
                      "container-max": "1280px",
                      "xl": "40px",
                      "md": "16px",
                      "gutter": "24px",
                      "unit": "4px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "label-sm": ["Plus Jakarta Sans"],
                      "body-lg": ["Plus Jakarta Sans"],
                      "h3": ["Plus Jakarta Sans"],
                      "button": ["Plus Jakarta Sans"],
                      "h1": ["Plus Jakarta Sans"],
                      "body-md": ["Plus Jakarta Sans"],
                      "h2": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "label-sm": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                      "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                      "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                      "button": ["15px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                      "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                      "h2": ["30px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<!-- Subtle Background Element for Depth (Minimalist) -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-40">
<div class="w-[800px] h-[800px] bg-gradient-to-tr from-surface-container via-surface-container-high to-surface-container-highest rounded-full blur-3xl mix-blend-multiply"></div>
</div>
<!-- Registration Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-outline-variant p-xl flex flex-col gap-lg z-10 shadow-sm relative">
<!-- Header -->
<header class="flex flex-col gap-sm items-center text-center pb-md border-b border-outline-variant/30">
<div class="flex items-center gap-xs text-primary mb-sm">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-h3 text-h3 tracking-tight">ScholarFlow</span>
</div>
<h1 class="font-h2 text-h2 text-on-surface">Create an Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the structured environment designed for academic clarity.</p>
</header>
<!-- Form Elements -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full h-12 px-md py-sm rounded-lg border border-outline-variant bg-surface-bright text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" id="fullName" placeholder="Dr. Jane Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 px-md py-sm rounded-lg border border-outline-variant bg-surface-bright text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" id="email" placeholder="jane.doe@university.edu" type="email"/>
</div>
</div>
<!-- Username (Demonstrating Success State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="username">Username</label>
<div class="relative">
<input class="w-full h-12 px-md pr-[40px] py-sm rounded-lg border border-primary bg-surface-bright text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="username" type="text" value="jane_doe_research"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-label-sm text-label-sm text-primary mt-xs">Username is available.</p>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 px-md py-sm rounded-lg border border-outline-variant bg-surface-bright text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password (Demonstrating Error State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-error" for="confirmPassword">Confirm Password</label>
<div class="relative">
<input class="w-full h-12 px-md pr-[40px] py-sm rounded-lg border border-error bg-error-container/10 text-on-surface font-body-md text-body-md focus:outline-none focus:border-error focus:ring-1 focus:ring-error transition-all" id="confirmPassword" type="password" value="•••••••"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<p class="font-label-sm text-label-sm text-error mt-xs flex items-start gap-xs">
                    Passwords do not match. Please try again.
                </p>
</div>
<!-- Submit Action -->
<div class="pt-sm mt-sm border-t border-outline-variant/30">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-button text-button flex items-center justify-center hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                    Create Account
                </button>
</div>
</form>
<!-- Footer Link -->
<div class="text-center mt-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Already have an account? </span>
<a class="font-button text-button text-primary hover:text-surface-tint underline decoration-primary/30 hover:decoration-surface-tint transition-colors" href="#">Login</a>
</div>
</main>
</body></html>
