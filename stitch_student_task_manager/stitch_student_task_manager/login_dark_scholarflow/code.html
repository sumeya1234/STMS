<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#464554",
                        "surface-variant": "#e1e3e4",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-secondary-container": "#576769",
                        "surface": "#f8f9fa",
                        "on-error": "#ffffff",
                        "background": "#0f172a", /* Deep slate for dark mode */
                        "primary-fixed": "#e1e0ff",
                        "secondary": "#516162",
                        "primary": "#10b981", /* Emerald Green */
                        "tertiary": "#904900",
                        "surface-tint": "#494bd6",
                        "surface-container-low": "#1e293b", /* Dark slate card */
                        "error-container": "#ffdad6",
                        "tertiary-container": "#b55d00",
                        "on-surface": "#f8fafc", /* Light text for dark mode */
                        "on-primary-container": "#ffffff",
                        "on-background": "#f8fafc", /* Light text */
                        "on-secondary-fixed": "#0e1e1f",
                        "tertiary-fixed": "#ffdcc5",
                        "secondary-fixed": "#d4e6e7",
                        "inverse-primary": "#c0c1ff",
                        "surface-container-lowest": "#0f172a",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#f8fafc", /* Light for inverse */
                        "secondary-container": "#d4e6e7",
                        "on-tertiary-fixed": "#301400",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "surface-dim": "#d9dadb",
                        "surface-container-high": "#334155",
                        "outline-variant": "#475569", /* Dark outline */
                        "on-error-container": "#93000a",
                        "outline": "#94a3b8", /* Lighter outline */
                        "on-tertiary-fixed-variant": "#703700",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#07006c",
                        "on-secondary-fixed-variant": "#394a4b",
                        "inverse-on-surface": "#0f172a",
                        "on-tertiary-container": "#fffbff",
                        "surface-container-highest": "#475569",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container": "#1e293b",
                        "secondary-fixed-dim": "#b8cacb",
                        "primary-container": "#059669" /* Darker emerald for container */
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "gutter": "24px",
                        "container-max": "1200px",
                        "stack-lg": "32px",
                        "margin-desktop": "40px",
                        "unit": "8px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "sans": ["'Plus Jakarta Sans'", "sans-serif"]
                    },
                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Minimalist Login Container -->
<main class="w-full max-w-md">
<!-- Brand Header within the centered layout -->
<div class="text-center mb-stack-lg">
<h1 class="text-h1 font-h1 text-primary tracking-tight mb-stack-sm">ScholarFlow</h1>
<p class="text-body-md font-body-md text-outline">Academic Clarity.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-low rounded-xl p-gutter shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-outline-variant">
<div class="mb-stack-lg">
<h2 class="text-h2 font-h2 text-on-surface mb-unit">Welcome back!</h2>
<p class="text-body-md font-body-md text-outline">Please sign in to continue your session.</p>
</div>
<form class="flex flex-col gap-stack-md">
<!-- Email/Username Field -->
<div>
<label class="block text-label-sm font-label-sm text-outline mb-unit" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-body-md font-body-md" id="email" name="email" placeholder="student@university.edu" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-unit">
<label class="block text-label-sm font-label-sm text-outline" for="password">Password</label>
<a class="text-caption font-caption text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-body-md font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center mt-unit">
<input class="h-4 w-4 rounded border-outline-variant bg-surface-container text-primary focus:ring-primary focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-md font-body-md text-outline" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-body-lg font-h3 text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background transition-all duration-200 active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Sign Up Link -->
<div class="mt-stack-md text-center">
<p class="text-body-md font-body-md text-outline">
                Don't have an account? 
                <a class="font-h3 text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</main>
</body></html>
