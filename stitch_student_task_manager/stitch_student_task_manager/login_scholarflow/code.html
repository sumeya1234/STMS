<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ScholarFlow</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "surface-container-low": "#eff4ff",
                    "outline-variant": "#bbcabf",
                    "tertiary-container": "#fc7c78",
                    "on-tertiary-fixed": "#410005",
                    "surface-tint": "#006c49",
                    "on-surface-variant": "#3c4a42",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#dce9ff",
                    "primary-fixed": "#6ffbbe",
                    "on-secondary-fixed": "#002117",
                    "surface-container-highest": "#d3e4fe",
                    "on-primary-fixed": "#002113",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#842225",
                    "on-primary-fixed-variant": "#005236",
                    "surface": "#f8f9ff",
                    "secondary": "#2b6954",
                    "on-secondary-container": "#306d58",
                    "inverse-surface": "#213145",
                    "surface-bright": "#f8f9ff",
                    "inverse-primary": "#4edea3",
                    "on-primary-container": "#00422b",
                    "on-tertiary-container": "#711419",
                    "on-surface": "#0b1c30",
                    "on-secondary-fixed-variant": "#0b513d",
                    "surface-variant": "#d3e4fe",
                    "tertiary-fixed-dim": "#ffb3af",
                    "tertiary": "#a43a3a",
                    "secondary-container": "#adedd3",
                    "primary": "#006c49",
                    "secondary-fixed-dim": "#95d3ba",
                    "primary-container": "#10b981",
                    "on-background": "#0b1c30",
                    "secondary-fixed": "#b0f0d6",
                    "background": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#ffdad7",
                    "primary-fixed-dim": "#4edea3",
                    "on-error": "#ffffff",
                    "outline": "#6c7a71",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "surface-dim": "#cbdbf5",
                    "inverse-on-surface": "#eaf1ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "xs": "4px",
                    "container-max": "1280px",
                    "xl": "40px",
                    "md": "16px",
                    "gutter": "24px",
                    "unit": "4px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "label-sm": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "h3": ["Plus Jakarta Sans"],
                    "button": ["Plus Jakarta Sans"],
                    "h1": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "h2": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                    "button": ["15px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                    "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "h2": ["30px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
            }
          }
        }
      }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md">
<!-- Login Card Canvas -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-[0_0_15px_rgba(0,0,0,0.02)] flex flex-col items-center">
<!-- Brand Header -->
<div class="mb-lg text-center">
<span class="font-h3 text-h3 text-primary-container font-extrabold tracking-tight">ScholarFlow</span>
</div>
<!-- Welcome Message -->
<div class="mb-xl text-center w-full">
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Welcome back!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form Elements -->
<form action="#" class="w-full flex flex-col gap-md" method="POST">
<!-- Email/Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline rounded py-[12px] pl-[44px] pr-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" name="email" placeholder="scholar@university.edu" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline rounded py-[12px] pl-[44px] pr-[44px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary-container transition-colors flex items-center justify-center focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full mt-[-8px]">
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary transition-colors hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-button text-button py-[14px] rounded mt-xs hover:bg-primary hover:shadow-[inset_0_0_0_2px_rgba(255,255,255,0.2)] transition-all flex items-center justify-center gap-sm" type="submit">
                Login
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Sign Up Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary-container font-semibold hover:text-primary hover:underline transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
