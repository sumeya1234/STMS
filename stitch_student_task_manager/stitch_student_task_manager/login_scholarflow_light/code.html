<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Minimalist Login Container -->
<main class="w-full max-w-md">
<!-- Brand Header within the centered layout -->
<div class="text-center mb-[32px]">
<h1 class="text-h1 font-h1 text-[#10b981] tracking-tight mb-[8px]">ScholarFlow</h1>
<p class="text-body-md font-body-md text-outline">Academic Clarity.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-low rounded-xl p-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-outline-variant">
<div class="mb-[32px]">
<h2 class="text-h2 font-h2 text-on-surface mb-[8px]">Welcome back!</h2>
<p class="text-body-md font-body-md text-outline">Please sign in to continue your session.</p>
</div>
<form class="flex flex-col gap-[16px]">
<!-- Email/Username Field -->
<div>
<label class="block text-label-sm font-label-sm text-outline mb-[8px]" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-[#10b981] focus:border-[#10b981] transition-colors text-body-md font-body-md" id="email" name="email" placeholder="student@university.edu" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-[8px]">
<label class="block text-label-sm font-label-sm text-outline" for="password">Password</label>
<a class="text-caption font-caption text-[#10b981] hover:text-[#059669] transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:ring-2 focus:ring-[#10b981] focus:border-[#10b981] transition-colors text-body-md font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center mt-[8px]">
<input class="h-4 w-4 rounded border-outline-variant bg-surface-container text-[#10b981] focus:ring-[#10b981] focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-md font-body-md text-outline" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="mt-[8px] w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-body-lg font-h3 text-on-primary bg-[#10b981] hover:bg-[#059669] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#10b981] focus:ring-offset-background transition-all duration-200 active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Sign Up Link -->
<div class="mt-[16px] text-center">
<p class="text-body-md font-body-md text-outline">
                Don't have an account? 
                <a class="font-h3 text-[#10b981] hover:text-[#059669] transition-colors" href="#">Sign up</a>
</p>
</div>
</main>
</body></html>
