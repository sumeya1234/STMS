<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Task - ScholarFlow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary": "#904900",
                        "secondary-fixed-dim": "#b8cacb",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-container": "#b55d00",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#c0c1ff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#394a4b",
                        "inverse-surface": "#2e3132",
                        "on-background": "#191c1d",
                        "on-surface-variant": "#464554",
                        "on-surface": "#191c1d",
                        "secondary-container": "#d4e6e7",
                        "primary-fixed": "#e1e0ff",
                        "surface-container-low": "#f3f4f5",
                        "on-primary-container": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d9dadb",
                        "tertiary-fixed-dim": "#ffb783",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-tertiary-fixed-variant": "#703700",
                        "surface-bright": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-fixed": "#301400",
                        "secondary": "#516162",
                        "outline-variant": "#c7c4d7",
                        "primary": "#10b981",
                        "secondary-fixed": "#d4e6e7",
                        "error": "#ba1a1a",
                        "surface-container": "#edeeef",
                        "surface-container-high": "#e7e8e9",
                        "surface": "#f8f9fa",
                        "primary-container": "#059669",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#0e1e1f",
                        "on-secondary-container": "#576769",
                        "surface-container-highest": "#e1e3e4",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-tint": "#10b981",
                        "on-tertiary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "background": "#f8f9fa",
                        "outline": "#767586",
                        "on-primary-fixed": "#07006c"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit": "8px",
                        "gutter": "24px",
                        "stack-md": "16px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "container-max": "1200px",
                        "margin-mobile": "16px"
                    },
                    fontFamily: {
                        'sans': ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    fontSize: {
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Modal Canvas -->
<main class="w-full max-w-[600px] bg-gray-800 rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col border border-gray-600 z-10">
<!-- Header -->
<header class="px-gutter py-stack-md border-b border-gray-700 flex justify-between items-center bg-gray-800">
<div>
<h1 class="text-h2 font-h2 text-white">New Task</h1>
<p class="text-caption font-caption text-gray-400 mt-1">Organize your academic workload.</p>
</div>
<button class="text-gray-400 hover:text-white transition-colors p-2 rounded-full hover:bg-gray-700" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Form Body -->
<div class="p-gutter flex-1 overflow-y-auto space-y-stack-lg">
<!-- Title Input -->
<div class="space-y-stack-sm">
<label class="text-label-sm font-label-sm text-gray-200 block" for="task-title">Task Title</label>
<input class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-body-md font-body-md text-white placeholder:text-gray-400 focus:ring-2 focus:ring-primary focus:bg-gray-600 transition-all" id="task-title" placeholder="e.g., Read Chapter 4 for Biology" type="text"/>
</div>
<!-- Description Input -->
<div class="space-y-stack-sm">
<label class="text-label-sm font-label-sm text-gray-200 block" for="task-desc">Description <span class="text-gray-400 font-normal text-caption">(Optional)</span></label>
<textarea class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-body-md font-body-md text-white placeholder:text-gray-400 focus:ring-2 focus:ring-primary focus:bg-gray-600 transition-all resize-none" id="task-desc" placeholder="Add any specific notes or details..." rows="3"></textarea>
</div>
<!-- Due Date & Time (Grid) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<div class="space-y-stack-sm">
<label class="text-label-sm font-label-sm text-gray-200 block" for="task-date">Deadline</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">calendar_today</span>
<input class="w-full bg-gray-700 border border-gray-600 rounded-lg pl-10 pr-4 py-3 text-body-md font-body-md text-white focus:ring-2 focus:ring-primary focus:bg-gray-600 transition-all" id="task-date" type="date"/>
</div>
</div>
<div class="space-y-stack-sm">
<label class="text-label-sm font-label-sm text-gray-200 block" for="task-time">Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">schedule</span>
<input class="w-full bg-gray-700 border border-gray-600 rounded-lg pl-10 pr-4 py-3 text-body-md font-body-md text-white focus:ring-2 focus:ring-primary focus:bg-gray-600 transition-all" id="task-time" type="time"/>
</div>
</div>
</div>
<!-- Priority Selection -->
<div class="space-y-stack-sm">
<label class="text-label-sm font-label-sm text-gray-200 block mb-2">Priority</label>
<div class="grid grid-cols-3 gap-3">
<!-- Low Priority -->
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="text-center py-2 px-3 rounded-full border border-gray-600 text-body-md font-body-md text-gray-300 hover:bg-gray-700 transition-colors peer-checked:bg-emerald-900/30 peer-checked:border-emerald-500 peer-checked:text-emerald-400">
                            Low
                        </div>
</label>
<!-- Medium Priority -->
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="medium"/>
<div class="text-center py-2 px-3 rounded-full border border-gray-600 text-body-md font-body-md text-gray-300 hover:bg-gray-700 transition-colors peer-checked:bg-amber-900/30 peer-checked:border-amber-500 peer-checked:text-amber-400">
                            Medium
                        </div>
</label>
<!-- High Priority -->
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="text-center py-2 px-3 rounded-full border border-gray-600 text-body-md font-body-md text-gray-300 hover:bg-gray-700 transition-colors peer-checked:bg-rose-900/30 peer-checked:border-rose-500 peer-checked:text-rose-400">
                            High
                        </div>
</label>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="px-gutter py-stack-md border-t border-gray-700 bg-gray-800 flex justify-end gap-3">
<button class="px-6 py-3 rounded-full text-label-sm font-label-sm text-gray-300 hover:bg-gray-700 transition-colors" type="button">
                Cancel
            </button>
<button class="px-8 py-3 rounded-full bg-primary text-on-primary text-label-sm font-label-sm hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-95 shadow-sm" type="button">
                Add Task
            </button>
</footer>
</main>
<!-- Optional Background Overlay for purely modal feel on larger screens (hidden on mobile if full screen) -->
<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-[2px] -z-10 pointer-events-none"></div>
</body></html>
